<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>La Minute Utile du Musicien – Vidéos</title>
  <style>
    :root { --gap: 10px; }
    body { font-family: Arial, sans-serif; margin: 0; background:#fafafa; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(250,250,250,0.95); backdrop-filter: blur(4px); padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin: 0 0 10px; font-size: 20px; }
    .filters { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }
    input { padding: 6px 10px; font-size: 14px; border:1px solid #ccc; border-radius: 6px; }
    #diff-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .diff-btn {
      border: 1px solid #999; border-radius: 16px; padding: 4px 10px;
      cursor: pointer; font-size: 0.85em; display: inline-flex; align-items: center; gap: 6px; background:#fff;
    }
    .diff-btn .swatch { width: 12px; height: 12px; border-radius: 50%; border:1px solid #666; }
    .diff-btn.active { box-shadow: inset 0 0 4px rgba(0,0,0,0.6); font-weight: bold; }

    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    #status { margin: 10px 0; color:#666; font-size: .9em; }
    #status.error { color:#b00020; }

    .video {
      border: 1px solid #ddd; border-radius: 10px; background:#fff; padding: 12px; margin-bottom: 15px;
      display: flex; gap: 15px; box-shadow:0 2px 4px rgba(0,0,0,.05);
    }
    .video img { max-width: 160px; width: 100%; height: auto; border-radius: 6px; }
    .video-info { min-width: 0; flex: 1; }
    .video h3 a { color: #174ea6; }
    .youtube-link {
      display: inline-block; margin-top: 10px; padding: 10px 14px;
      border-radius: 8px; background: #c5221f; color: #fff;
      text-decoration: none; font-weight: bold; min-height: 24px;
    }
    .youtube-link:hover, .youtube-link:focus-visible { background: #9f1b18; }
    .video a:focus-visible { outline: 3px solid #174ea6; outline-offset: 3px; }
    @media (max-width: 640px) {
      .video { flex-direction: column; }
      .video img { max-width: 100%; width: 240px; }
      .youtube-link { font-size: 1.1rem; padding: 14px 18px; }
    }
    .chip {
      display:inline-flex; align-items:center; gap:6px; border:1px solid #ccc; border-radius:16px; padding:2px 8px; font-size:0.85em;
    }
    .swatch { display:inline-block; width:12px; height:12px; border:1px solid #999; border-radius:50%; }
    .pdfs { margin-top: 8px; }
    .pdfs li { font-size: 0.9em; }

    #loader { text-align:center; color:#666; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Vidéos & PDFs associés</h1>
    <div class="filters">
      <input id="q" placeholder="Rechercher…" oninput="debouncedSearch()">
      <div id="diff-buttons"></div>
    </div>
  </header>

  <main>
    <div id="status"></div>
    <div id="results"></div>
    <div id="loader" hidden>Chargement…</div>
    <div id="sentinel"></div>
  </main>

  <script>
    const CATALOGUE_URL = "./catalogue_videos.json";
    let catalogue = [];
    const PAGE_SIZE = 20;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      })[char]);
    }
    function safeUrl(value) {
      const url = String(value || "");
      try {
        const parsed = new URL(url, location.href);
        return url && ["http:", "https:"].includes(parsed.protocol) ? escapeHTML(url) : "#";
      } catch { return "#"; }
    }

    // Palette couleurs
    const diffColors = {
      "débutant": "#f3f3f3",
      "novice": "#e8d418",
      "intermédiaire": "#ee1611",
      "avancé": "#18e821",
      "expert": "#1876e8",
      "maître": "#82240b",
      "grand maître": "#0c0c0c"
    };

    // Etat
    let offset = 0, total = 0, filtered = [];
    let loading = false, done = false;
    let currentQ = "", currentDiffs = [];
    let debounceId;

    function setStatus(msg, isError=false) {
      const s = document.getElementById("status");
      s.className = isError ? "error" : "";
      s.textContent = msg || "";
    }
    function setLoader(visible) {
      document.getElementById("loader").hidden = !visible;
    }

    function renderDiffButtons() {
      const container = document.getElementById("diff-buttons");
      container.innerHTML = "";
      Object.entries(diffColors).forEach(([label, color]) => {
        const btn = document.createElement("button");
        btn.className = "diff-btn";
        btn.dataset.value = label;
        btn.innerHTML = `<span class="swatch" style="background:${color}"></span> ${label}`;
        btn.onclick = () => {
          btn.classList.toggle("active");
          resetAndSearch();
        };
        container.appendChild(btn);
      });
    }

    function getSelectedDiffs() {
      return Array.from(document.querySelectorAll(".diff-btn.active")).map(b => b.dataset.value);
    }

    function debouncedSearch() {
      clearTimeout(debounceId);
      debounceId = setTimeout(resetAndSearch, 300); // ← 300 ms
    }

    function resetAndSearch() {
      currentQ = document.getElementById("q").value.trim();
      currentDiffs = getSelectedDiffs();
      offset = 0; total = 0; done = false;
      document.getElementById("results").innerHTML = "";
      setStatus("");
      if (!catalogue.length) return;
      const query = currentQ.toLocaleLowerCase("fr").trim();
      filtered = catalogue.filter(v => (!query || (v.nom || "").toLocaleLowerCase("fr").includes(query))
        && (!currentDiffs.length || currentDiffs.some(diff => (v.difficulties || []).includes(diff))));
      total = filtered.length;
      if (!total) { setStatus("Aucun résultat."); return; }
      loadNextPage();
    }

    function loadNextPage() {
      if (loading || done) return;
      loading = true;
      const items = filtered.slice(offset, offset + PAGE_SIZE);
      renderAppend(items);
      offset += items.length;
      done = offset >= total;
      loading = false;
    }


  function formatDateFR(isoStr) {
    if (!isoStr) return "-";
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffSec = Math.floor(diffMs / 1000);
    const diffMin = Math.floor(diffSec / 60);
    const diffH = Math.floor(diffMin / 60);
    const diffJ = Math.floor(diffH / 24);

    if (diffSec < 60) return "à l'instant";
    if (diffMin < 60) return `il y a ${diffMin} min`;
    if (diffH < 24) return `il y a ${diffH} h`;
    if (diffJ === 1) return "hier";
    if (diffJ < 7) return `il y a ${diffJ} j`;

    // sinon format complet français
    return d.toLocaleString("fr-FR", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }



    function renderAppend(items) {
      const container = document.getElementById("results");
      items.forEach(v => {
        const diffChips = (v.difficulties || []).map(d => `
          <span class="chip">
            <span class="swatch" style="background:${diffColors[d] || "#ccc"}"></span>
            ${d}
          </span>
        `).join(" ");

        const pdfList = (v.pdfs || []).map(p => `
          <li>
            <a href="${safeUrl(p.path)}" target="_blank">${escapeHTML(p.nom)}</a>
            ${p.gpx ? `(<a href="${safeUrl(p.gpx)}" target="_blank">GPX</a>)` : ""}
            ${p.difficulte ? `<span class="chip"><span class="swatch" style="background:${diffColors[p.difficulte]||"#ccc"}"></span>${escapeHTML(p.difficulte)}</span>` : ""}
          </li>
        `).join("");

        const div = document.createElement("div");
        div.className = "video";
        div.innerHTML = `
          <a href="${safeUrl(v.url)}" aria-label="Ouvrir la vidéo sur YouTube : ${escapeHTML(v.nom)}">
            <img src="${safeUrl(v.thumbnail)}" alt="miniature de la vidéo">
          </a>
          <div class="video-info">
            <h3><a href="${safeUrl(v.url)}">${escapeHTML(v.nom)}</a></h3>
            <div><b>Date :</b> ${formatDateFR(v.created_at)}</div>
            <div><b>Difficultés :</b> ${diffChips || "-"}</div>
            <ul class="pdfs">${pdfList}</ul>
            <a class="youtube-link" href="${safeUrl(v.url)}" aria-label="Voir sur YouTube : ${escapeHTML(v.nom)}">▶ Voir sur YouTube</a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Infinite scroll
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) loadNextPage();
    }, { rootMargin: '600px' });

    (async function init() {
      renderDiffButtons();
      document.getElementById("q").addEventListener("input", debouncedSearch);
      observer.observe(document.getElementById("sentinel"));
      setStatus("Chargement du catalogue…");
      try {
        const response = await fetch(CATALOGUE_URL, {cache: "no-cache"});
        if (!response.ok) throw new Error("JSON HTTP " + response.status);
        const data = await response.json();
        if (data.schema_version !== 1 || !Array.isArray(data.items)) throw new Error("Catalogue invalide");
        catalogue = data.items;
        resetAndSearch();
      } catch (error) {
        console.error(error);
        setStatus("Catalogue indisponible. Veuillez réessayer ultérieurement.", true);
      }
    })();
  </script>
</body>
</html>
