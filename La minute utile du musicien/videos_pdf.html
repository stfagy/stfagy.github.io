<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>La Minute Utile du Musicien – Vidéos</title>
  <style>
    body { font-family: Arial; margin: 20px; background:#fafafa; }
    h1 { margin-bottom: 15px; }
    .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    input, select, button { padding: 6px 10px; font-size: 14px; }
    .video { border: 1px solid #ddd; border-radius: 10px; background:#fff; padding: 12px; margin-bottom: 15px; display: flex; gap: 15px; box-shadow:0 2px 4px rgba(0,0,0,.05);}
    .video img { max-width: 160px; border-radius: 6px; }
    .pdfs { margin-top: 8px; }
    .pdfs li { font-size: 0.9em; }
    .chip {
      display:inline-flex; align-items:center; gap:6px;
      border:1px solid #ccc; border-radius:16px;
      padding:2px 8px; font-size:0.85em;
    }
    .swatch {
      display:inline-block; width:12px; height:12px;
      border:1px solid #999; border-radius:50%;
    }
    #pager { margin-top:20px; display:flex; gap:10px; align-items:center; }
    #pager button { padding:6px 12px; }
    .diff-btn {
  border: 1px solid #999;
  border-radius: 16px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 0.85em;
  margin-right: 6px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.diff-btn .swatch {
  width: 12px; height: 12px;
  border-radius: 50%; border:1px solid #666;
}
.diff-btn.active {
  box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
  font-weight: bold;
}

  </style>
</head>
<body>
  <h1>Vidéos & PDFs associés</h1>

div class="filters">
  <input id="q" placeholder="Rechercher (min. 3 caractères)…" oninput="debouncedSearch()">
  <div id="diff-buttons"></div>
</div>

  <div id="results"></div>
  <div id="pager"></div>

  <script>
    const API = "https://stf-minute-api.onrender.com";
    const PAGE_SIZE = 20;

    // Palette couleurs (comme dans ton Python)
const diffColors = {
  "débutant": "#f3f3f3",
  "novice": "#e8d418",
  "intermédiaire": "#ee1611",
  "avancé": "#18e821",
  "expert": "#1876e8",
  "maître": "#82240b",
  "grand maître": "#0c0c0c"
};

function renderDiffButtons() {
  const container = document.getElementById("diff-buttons");
  container.innerHTML = "";
  Object.entries(diffColors).forEach(([label, color]) => {
    const btn = document.createElement("button");
    btn.className = "diff-btn";
    btn.dataset.value = label;
    btn.innerHTML = `<span class="swatch" style="background:${color}"></span> ${label}`;
    btn.onclick = () => {
      btn.classList.toggle("active");
      loadVideos(0);
    };
    container.appendChild(btn);
  });
}

function getSelectedDiffs() {
  return Array.from(document.querySelectorAll(".diff-btn.active"))
              .map(b => b.dataset.value);
}

async function loadVideos(offset = 0) {
  const q = document.getElementById("q").value.trim();
  const diffs = getSelectedDiffs();
  const params = new URLSearchParams({ q, limit: PAGE_SIZE, offset });
  diffs.forEach(d => params.append("diff", d));
  const res = await fetch(`${API}/videos?` + params.toString());
  const data = await res.json();
  renderResults(data.items);
  renderPager(data.total, offset);
}


    async function loadDifficulties() {
      const res = await fetch(`${API}/difficulties`);
      const diffs = await res.json();
      const sel = document.getElementById("diff");
      diffs.forEach(d => {
        if (!d.difficulte) return;
        const opt = document.createElement("option");
        opt.value = d.difficulte;
        opt.textContent = `${d.difficulte} (${d.count})`;
        sel.appendChild(opt);
      });
    }

    async function loadVideos(offset = 0) {
      const q = document.getElementById("q").value.trim();
      const diff = document.getElementById("diff").value;
      const params = new URLSearchParams({ q, diff, limit: PAGE_SIZE, offset });
      const res = await fetch(`${API}/videos?` + params.toString());
      const data = await res.json();

      renderResults(data.items);
      renderPager(data.total, offset);
    }

    function renderResults(items) {
      const container = document.getElementById("results");
      container.innerHTML = "";
      items.forEach(v => {
        const diffChips = v.difficulties.map(d => `
          <span class="chip">
            <span class="swatch" style="background:${diffColors[d] || "#ccc"}"></span>
            ${d}
          </span>
        `).join(" ");

        const pdfList = v.pdfs.map(p => `
          <li>
            <a href="${p.path}" target="_blank">${p.nom}</a>
            ${p.gpx ? `(<a href="${p.gpx}" target="_blank">GPX</a>)` : ""}
            ${p.difficulte ? `<span class="chip"><span class="swatch" style="background:${diffColors[p.difficulte]||"#ccc"}"></span>${p.difficulte}</span>` : ""}
          </li>
        `).join("");

        const div = document.createElement("div");
        div.className = "video";
        div.innerHTML = `
          <a href="${v.url}" target="_blank">
            <img src="${v.thumbnail}" alt="miniature">
          </a>
          <div>
            <h3>${v.nom}</h3>
            <div><b>Date :</b> ${v.created_at || "-"}</div>
            <div><b>Difficultés :</b> ${diffChips || "-"}</div>
            <ul class="pdfs">${pdfList}</ul>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderPager(total, offset) {
      const pager = document.getElementById("pager");
      pager.innerHTML = "";
      const currentPage = Math.floor(offset / PAGE_SIZE) + 1;
      const totalPages = Math.ceil(total / PAGE_SIZE);
      pager.textContent = `Page ${currentPage} / ${totalPages}`;
      if (currentPage > 1) {
        const prev = document.createElement("button");
        prev.textContent = "← Précédent";
        prev.onclick = () => loadVideos(offset - PAGE_SIZE);
        pager.prepend(prev);
      }
      if (currentPage < totalPages) {
        const next = document.createElement("button");
        next.textContent = "Suivant →";
        next.onclick = () => loadVideos(offset + PAGE_SIZE);
        pager.append(next);
      }
    }

    // init
    loadDifficulties();
    loadVideos(0);
  </script>
</body>
</html>
